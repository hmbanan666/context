# Synthetic Russian questions for fictional projects `context` and `expi`.
# Prod runs point --questions at a private file that may use item_id or source_id.
# This file uses required substrings only. No production notes.
questions:
  - id: context_nightly_distill
    question: улучшить ночную дистилляцию
    areas: [projects]
    read_areas: [projects]
    mode: pack
    project: context
    budget_bytes: 4096
    expected:
      - substring: distills each source
    outranks:
      - substring: off-host backups
    forbidden_substrings:
