name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm run eval:retrieval
      - name: Validate Compose backup defaults
        env:
          CONTEXT_HOST: context.example
          CONTEXT_PROXY_NETWORK: context-test
        run: |
          docker compose -f deploy/compose.yaml config --format json > .output/compose.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { readBackupConfig } from './dist/src/backup-config.js';
          const env = JSON.parse(readFileSync('.output/compose.json', 'utf8')).services.context.environment;
          const config = readBackupConfig(env);
          assert.equal(config.directory, '/app/backups');
          assert.equal(config.timeZone, 'UTC');
          assert.equal(config.at, '03:30');
          assert.equal(config.keep, 7);
          assert.equal(config.target.kind, 'none');
          JS
      - run: docker build -t context:ci .
      - run: npm run test:container
      - run: npm run test:oauth
