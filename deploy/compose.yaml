name: context

services:
  context:
    build:
      context: ..
    restart: unless-stopped
    environment:
      CONTEXT_PUBLIC_URL: ${CONTEXT_PUBLIC_URL:?Set the public HTTPS MCP URL}
      CONTEXT_AREAS: ${CONTEXT_AREAS:-personal}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sources:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g

volumes:
  sources:
